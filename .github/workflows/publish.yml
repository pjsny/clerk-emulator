name: Publish

# Publishes to npm via OIDC trusted publishing (no NPM_TOKEN) when a v* tag is
# pushed. One-time setup on npmjs.com: after the first publish, add a Trusted
# Publisher (GitHub Actions -> this repo -> publish.yml). Provenance is emitted
# automatically (package name matches the repo name).
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use npm >= 11.5.1 (required for OIDC trusted publishing)
        run: npm install -g npm@latest

      - run: npm ci

      - run: npm run type-check

      - run: npm run build

      - run: npm test

      - name: Publish (tokenless OIDC, automatic provenance)
        # Idempotent: skip if this version is already on npm, so re-tagging or
        # backfilling a tag for an already-published version doesn't fail.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "clerk-emulator@$VERSION" version >/dev/null 2>&1; then
            echo "clerk-emulator@$VERSION is already published — skipping."
          else
            npm publish
          fi
