name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  e2e:
    name: Browser E2E (@clerk/react ${{ matrix.clerk-react }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # @clerk/react Active major (Core 3). Floor and latest of the supported
        # major, to catch FAPI regressions across the clerk-js 6.x lineage.
        # (Core 2 / v5 is in LTS but ships a different sign-in API + an upstream
        # @clerk/shared build issue, so it needs a separate Core-2 frontend.)
        clerk-react: ["6.0.0", "6"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build emulator
        run: |
          npm ci
          npm run build

      - name: Install e2e runner
        run: npm ci
        working-directory: e2e

      - name: Install frontend with @clerk/react@${{ matrix.clerk-react }}
        working-directory: e2e/frontend
        run: |
          rm -f package-lock.json
          npm install "@clerk/react@${{ matrix.clerk-react }}"

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run browser e2e (boots emulator + Vite automatically)
        run: npm test
        working-directory: e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-clerk-${{ matrix.clerk-react }}
          path: e2e/playwright-report/
          retention-days: 7
