name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same ref so rapid pushes don't pile up runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  e2e:
    name: "Browser E2E: ${{ matrix.label }}"
    runs-on: ubuntu-latest
    # The React cells load the clerk-js bundle from jsDelivr at runtime, so they
    # can flake when the CDN rate-limits a runner (clerk-js never loads). They
    # stay informational (cdnDependent -> non-blocking). The vanilla cells bundle
    # clerk-js (no CDN), so they are hermetic and gate CI alongside unit/backend.
    continue-on-error: ${{ matrix.cdnDependent || false }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "@clerk/react 6 (Core 3 latest)"
            frontend: frontend
            pkg: "@clerk/react@6"
            config: playwright.config.ts
            artifact: clerk-react-6-latest
            cdnDependent: true
          - label: "@clerk/clerk-react 5 (Core 2 LTS)"
            frontend: frontend-v5
            pkg: "@clerk/clerk-react@5"
            config: playwright.https.config.ts
            artifact: clerk-react-5
            cdnDependent: true
          - label: "vanilla @clerk/clerk-js 6 (Core 3)"
            frontend: frontend-vanilla
            pkg: "@clerk/clerk-js@6"
            config: playwright.vanilla.config.ts
            artifact: clerk-js-vanilla-6
          - label: "vanilla @clerk/clerk-js 5 (Core 2 LTS)"
            frontend: frontend-vanilla
            pkg: "@clerk/clerk-js@5"
            config: playwright.vanilla.config.ts
            artifact: clerk-js-vanilla-5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build emulator
        run: |
          npm ci
          npm run build

      - name: Install e2e runner
        run: npm ci
        working-directory: e2e

      - name: Install ${{ matrix.frontend }} with ${{ matrix.pkg }}
        working-directory: e2e/${{ matrix.frontend }}
        run: |
          rm -f package-lock.json
          npm install "${{ matrix.pkg }}"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright (Chromium)
        # ubuntu-latest already ships the Chromium system libs, so skip
        # --with-deps (the apt step that adds optional fonts and is the slow,
        # cancel-prone part). The browser binary is restored from cache above.
        run: npx playwright install chromium
        working-directory: e2e

      - name: Run browser e2e (boots emulator + Vite automatically)
        run: npx playwright test --config=${{ matrix.config }}
        working-directory: e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.artifact }}
          path: e2e/playwright-report/
          retention-days: 7

  backend-sdk:
    name: "Backend SDK: @clerk/backend ${{ matrix.clerk-backend }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Recent @clerk/backend majors (Core 3). Both expose the SDK surface the
        # tests use (users/organizations/authenticateRequest + the m2m namespace,
        # which exists from 2.9.0). Older majors use the pre-Core-3 API.
        clerk-backend: ["2", "3"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pin @clerk/backend ${{ matrix.clerk-backend }}
        run: npm install -D "@clerk/backend@${{ matrix.clerk-backend }}"

      - name: Test
        run: npm test
